[package]
name = "image-indexing-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
dirwalk = "1.1.1"
filesize = "0.2.0"
image = "0.25.10"
oklab = "1.1.2"
okmain = "0.2.0"
rayon = "1.12.0"
rgb = "0.8.53"
serde_json = "1.0.154"
smol_str = "0.3.7"
tokio = { version = "1.54.1", features = ["full"] }
turso = "0.8.3"

[dev-dependencies]
colored_text = "0.6.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
