[package]
name = "image-indexing-engine"
version = "0.1.0"
edition = "2024"
default-run = "image-indexing-engine"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
dirwalk = "1.1.1"
image = "0.25.10"
oklab = "1.1.2"
okmain = "0.2.0"
path-slash = "0.2.1"
rayon = "1.12.0"
rgb = { version = "0.8.53", features = ["as-bytes"], default-features = false }
serde_json = "1.0.154"
smol_str = "0.3.7"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
turso = { version = "0.8.3", default-features = false, features = ["mimalloc"] }
xmpkit = { version = "0.1.6", features = ["jpeg", "mutli-thread", "png", "svg", "webp"], default-features = false }

[dev-dependencies]
colored_text = "0.6.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
