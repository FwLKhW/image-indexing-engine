[package]
name = "iie"
version = "0.3.0"
edition = "2024"
description = "An image indexing engine"
default-run = "iie"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
colored_text = "0.6.0"
csv = "1.4.0"
image = { version = "0.25.10", features = [
    "jpeg",
    "png",
    "rayon",
], default-features = false }
imagesize = "0.15.0"
okmain = "0.2.0"
path-slash = "0.2.1"
rayon = "1.12.0"
rgb = { version = "0.8.53", features = ["as-bytes"], default-features = false }
rusqlite = "0.41.1"
xmpkit = { version = "0.1.6", features = [
    "jpeg",
    "png",
], default-features = false }


[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

# https://www.namtao.com/rust/
[lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
arithmetic_side_effects = "deny"
as_conversions = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
