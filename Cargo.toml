[package]
name = "index"
version = "0.1.0"
edition = "2024"
description = "An image indexing engine"
default-run = "index"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
colored_text = "0.6.0"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
image = { version = "0.25.10", features = [
    "jpeg",
    "png",
    "rayon",
    "webp",
], default-features = false }
oklab = "1.1.2"
okmain = "0.2.0"
path-slash = "0.2.1"
rayon = "1.12.0"
rgb = { version = "0.8.53", features = ["as-bytes"], default-features = false }
serde_json = "1.0.154"
xmpkit = { version = "0.1.6", features = [
    "jpeg",
    "mutli-thread",
    "png",
    "webp",
], default-features = false }


[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
